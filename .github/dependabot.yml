version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not usable here yet. `eslint-config-next` vendors
      # typescript-eslint ^8.x, which refuses to load against TS 7 —
      # `npm run lint` dies at module resolution before linting a single file:
      #   "Error: typescript-eslint does not support TS 7.0."
      # Upstream tracking: typescript-eslint/typescript-eslint#10940
      #
      # Because the dev-dependency group bundles this major with everything
      # else, one unusable package failed the whole grouped PR — twice (#75
      # and #82, both closed unmerged). Ignoring only the major keeps 5.x
      # patch/minor updates (including security fixes) flowing normally.
      #
      # REMOVE THIS once typescript-eslint ships TS >= 7 support, then let
      # the TypeScript 7 upgrade land as its own reviewed PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ESLint 10 crashes `npm run lint` with eslint-config-next@16.
      # Next's vendored Babel parser (`eslint-config-next/parser` →
      # `next/dist/compiled/babel/eslint-parser`) returns a ScopeManager
      # without `addGlobals`, which ESLint 10 calls during SourceCode.finalize:
      #   TypeError: scopeManager.addGlobals is not a function
      # eslint-plugin-react@7 (also vendored by eslint-config-next) still
      # calls the removed `context.getFilename` API.
      # Upstream: https://github.com/vercel/next.js/issues/89764
      #
      # The dev-dependency group bundled this major with the jsdom bump and
      # failed CI on PR #162. Ignore only the major so 9.x updates still land.
      #
      # REMOVE THIS once eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

