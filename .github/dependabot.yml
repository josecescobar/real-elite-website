version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not usable here yet. `eslint-config-next` vendors
      # typescript-eslint ^8.x, which refuses to load against TS 7 —
      # `npm run lint` dies at module resolution before linting a single file:
      #   "Error: typescript-eslint does not support TS 7.0."
      # Upstream tracking: typescript-eslint/typescript-eslint#10940
      #
      # Because the dev-dependency group bundles this major with everything
      # else, one unusable package failed the whole grouped PR — twice (#75
      # and #82, both closed unmerged). Ignoring only the major keeps 5.x
      # patch/minor updates (including security fixes) flowing normally.
      #
      # REMOVE THIS once typescript-eslint ships TS >= 7 support, then let
      # the TypeScript 7 upgrade land as its own reviewed PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ESLint 10 is not usable here yet. `eslint-config-next` 16.3.6
      # declares peer `eslint >= 9`, but it still cannot lint on ESLint 10:
      #   - Its parser (`eslint-config-next/parser` →
      #     `next/dist/compiled/babel/eslint-parser`) returns a ScopeManager
      #     without `addGlobals`. `npm run lint` dies inside ESLint itself:
      #       TypeError: scopeManager.addGlobals is not a function
      #       at eslint/lib/languages/js/source-code/source-code.js:221
      #   - `eslint-plugin-react` 7.37.5 (vendored by eslint-config-next)
      #     still calls the removed `context.getFilename` API:
      #       TypeError: Error while loading rule 'react/display-name':
      #       contextOrFilename.getFilename is not a function
      #   - The same package vendors `eslint-plugin-import` 2.32.0 and
      #     `eslint-plugin-jsx-a11y` 6.10.2, whose peers stop at ESLint 9.
      # This repo's `eslint.config.mjs` spreads the flat
      # `eslint-config-next/core-web-vitals` array directly. `@eslint/eslintrc`
      # FlatCompat is installed and unused; it is not the piece that breaks.
      # Upstream: https://github.com/vercel/next.js/issues/89764
      #
      # The dev-dependency group bundled this major with wanted patch bumps
      # and failed CI on PR #162 and PR #176. Ignoring only the major keeps
      # 9.x patch/minor updates (including security fixes) flowing normally.
      #
      # REMOVE THIS once eslint-config-next ships a parser and plugin stack
      # that support ESLint 10, then let the ESLint 10 upgrade land as its
      # own reviewed PR.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

