name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          # Skip the image-optimization prebuild in CI — images are already
          # optimized in the repo, and sharp re-encoding isn't needed to
          # validate the build.
          SKIP_IMAGE_OPTIMIZE: '1'

      # Asserts over the BUILT HTML that every internal link the site renders
      # resolves and none points at a redirect. It needs .next/, so it cannot
      # live in `npm test` — and a link's destination is a fact about the
      # rendered page, which is why the source-level scan it replaced kept
      # missing cases no lexical rule could express.
      - name: Check rendered internal links
        run: npm run test:built
